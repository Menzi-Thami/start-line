# Updates go to staging first, like every change, and reach production with the next release.
# Dependabot reads this file from the default branch (main), so it takes effect after that release.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /client
    target-branch: staging
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
