name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Integration tests run against real SQL Server, never EF's in-memory provider. The password is
      # generated per run and masked, so nothing secret lives in the repo.
      - name: Start SQL Server
        run: |
          password="$(openssl rand -hex 16)Aa1!"
          echo "::add-mask::$password"
          docker run -d --name sql -p 1433:1433 -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$password" mcr.microsoft.com/mssql/server:2022-latest
          echo "STARTLINE_TEST_SQL=Server=localhost,1433;Database=StartLine_IntegrationTests;User Id=sa;Password=$password;TrustServerCertificate=True" >> "$GITHUB_ENV"
          for attempt in $(seq 1 40); do
            if docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$password" -Q "SELECT 1" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 3
          done
          echo "SQL Server did not start in time" && docker logs sql && exit 1
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore StartLine.slnx
      - run: dotnet format StartLine.slnx --verify-no-changes --no-restore
      - run: dotnet build StartLine.slnx -c Release --no-restore
      - run: dotnet test StartLine.slnx -c Release --no-build --logger trx

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  e2e:
    name: end-to-end (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # The real API (no database needed: plans are stateless and accounts stay off) and a
      # production build of the client, driven through Chromium.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report
