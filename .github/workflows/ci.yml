name: ci

# Run by hand (Actions → ci → Run workflow), or by Deps doctor on its branches. This launch-QA branch also runs the
# suite on push so its SQL-backed persistence tests can use the runner's disposable database. Other branches retain
# manual validation to conserve Actions minutes.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Integration tests run against real SQL Server, never EF's in-memory provider. The password is
      # generated per run and masked, so nothing secret lives in the repo.
      - name: Start SQL Server
        run: |
          password="$(openssl rand -hex 16)Aa1!"
          echo "::add-mask::$password"
          docker run -d --name sql -p 1433:1433 -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$password" mcr.microsoft.com/mssql/server:2022-latest
          echo "STARTLINE_TEST_SQL=Server=localhost,1433;Database=StartLine_IntegrationTests;User Id=sa;Password=$password;TrustServerCertificate=True" >> "$GITHUB_ENV"
          for attempt in $(seq 1 40); do
            if docker exec sql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$password" -Q "SELECT 1" > /dev/null 2>&1; then
              exit 0
            fi
            sleep 3
          done
          echo "SQL Server did not start in time" && docker logs sql && exit 1
      # Microsoft's current install script, not actions/setup-dotnet: the copy bundled in setup-dotnet@v6 downloads from
      # a storage account that began refusing public access on 25 Oct 2026 (409 PublicAccessNotPermitted). The current
      # script downloads from builds.dotnet.microsoft.com, but only for an exact version: asked for a channel, it still
      # tries an aka.ms link that leads to the blocked account. So look up the latest 10.0 SDK first (global.json's
      # rollForward allows any 10.0 feature band from its own up).
      - name: Install .NET
        run: |
          curl -fsSL --retry 3 https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          version=$(curl -fsSL --retry 3 https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json | jq -r '."latest-sdk"')
          bash "$RUNNER_TEMP/dotnet-install.sh" --version "$version" --install-dir "$HOME/.dotnet"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          "$HOME/.dotnet/dotnet" --version
      - run: dotnet restore StartLine.slnx
      - run: dotnet format StartLine.slnx --verify-no-changes --no-restore
      - run: dotnet build StartLine.slnx -c Release --no-restore
      - run: dotnet test StartLine.slnx -c Release --no-build --logger trx
      - name: Verify migrations match the model
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/StartLine.Infrastructure --startup-project src/StartLine.Infrastructure --no-build --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --testTimeout=30000 --maxWorkers=1
      - run: npm run build
      - run: npm audit --audit-level=high

  e2e:
    name: end-to-end (Playwright)
    runs-on: ubuntu-latest
    # Fails cleanly with its log kept, rather than letting a runaway starve the runner.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      # Microsoft's current install script, not actions/setup-dotnet: the copy bundled in setup-dotnet@v6 downloads from
      # a storage account that began refusing public access on 25 Oct 2026 (409 PublicAccessNotPermitted). The current
      # script downloads from builds.dotnet.microsoft.com, but only for an exact version: asked for a channel, it still
      # tries an aka.ms link that leads to the blocked account. So look up the latest 10.0 SDK first (global.json's
      # rollForward allows any 10.0 feature band from its own up).
      - name: Install .NET
        run: |
          curl -fsSL --retry 3 https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          version=$(curl -fsSL --retry 3 https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json | jq -r '."latest-sdk"')
          bash "$RUNNER_TEMP/dotnet-install.sh" --version "$version" --install-dir "$HOME/.dotnet"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          "$HOME/.dotnet/dotnet" --version
      - uses: actions/setup-node@v7
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # The real API (no database needed: plans are stateless and accounts stay off) and a
      # production build of the client, driven through Chromium.
      - run: npx playwright install --with-deps chromium
      - name: npx playwright test
        run: |
          # Memory and CPU every 20 s, so a runaway process is visible in the log.
          (while true; do echo "--- resources $(date +%T)"; free -m | sed -n 2p; ps -eo pid,rss,pcpu,comm --sort=-rss | head -6; sleep 20; done) &
          npx playwright test
        env:
          CI: true
          DEBUG: pw:webserver
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: account-responsive-visual-qa
          path: client/test-results/**/*-account-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: race-week-visual-qa
          path: client/test-results/**/race-week-*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report
