name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore StartLine.slnx
      - run: dotnet format StartLine.slnx --verify-no-changes --no-restore
      - run: dotnet build StartLine.slnx -c Release --no-restore
      - run: dotnet test StartLine.slnx -c Release --no-build --logger trx
