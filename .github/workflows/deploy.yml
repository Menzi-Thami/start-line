name: deploy

# Ships main in two steps. Every merge deploys to staging first (its own API, database and website environment), so a
# change can be tried on real infrastructure without touching runners. Production waits for approval on the
# production environment (Settings → Environments → production → required reviewers), then deploys the same commit.
# Also runnable by hand (Actions → deploy → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deployment at a time, and never cancel one halfway through a migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  staging:
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: staging
      website-environment: staging
    secrets: inherit

  production:
    needs: staging
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
    secrets: inherit
