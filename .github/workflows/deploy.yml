name: deploy

# Ships main to production, with no clicks. Changes are tried on staging first: they land on the `staging` branch,
# which deploy-staging-only.yml puts on the staging API, database and website and smoke-checks. Once they look right
# there, staging is merged into main and this deploys that commit to production, then scripts/smoke.sh checks
# production the way a runner first meets it (a failure turns the run red to say so). To pause production for a change
# that needs eyes first, add required reviewers to the production environment (Settings → Environments → production).
# Also runnable by hand (Actions → deploy → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deployment at a time, and never cancel one halfway through a migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
    secrets: inherit

  production-check:
    needs: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Smoke check production
        run: scripts/smoke.sh https://taperday.run https://app-taperday-api-3ghg5t.azurewebsites.net
