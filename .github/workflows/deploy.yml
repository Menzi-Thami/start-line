name: Ops - Redeploy production

# Not a step of shipping (docs/how-we-ship.md): production is released with "3 - Release to production" (release.yml).
# This deploys `main` as it is, again, by hand: Actions → "Ops - Redeploy production" → Run workflow. Use it after an
# urgent fix was merged straight into `main`, or to repeat a deploy that failed halfway. It never runs by itself, so a
# push to `main` alone changes nothing on taperday.run. After deploying, scripts/smoke.sh checks production the way a
# runner first meets it (a failure turns the run red to say so).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deployment at a time, and never cancel one halfway through a migration.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  production:
    uses: ./.github/workflows/deploy-environment.yml
    with:
      environment: production
    secrets: inherit

  production-check:
    needs: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Smoke check production
        run: scripts/smoke.sh https://taperday.run https://app-taperday-api-3ghg5t.azurewebsites.net
