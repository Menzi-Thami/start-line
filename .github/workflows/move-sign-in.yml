# Moves existing runners onto their new password-capable Microsoft accounts (docs/password-sign-in.md, "Moving existing
# email-code runners"). The pairs live in the production secret RUNNER_IDENTITY_MOVES, one "old-object-id new-object-id"
# per line, so no ID shows in the run's inputs or log. "check" changes nothing; run it first.
name: Ops - Move runner sign-in

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check (changes nothing), apply, or undo (moves the same pairs back)'
        type: choice
        options: [check, apply, undo]
        default: check

permissions:
  contents: read

concurrency:
  group: production-move-sign-in
  cancel-in-progress: false

jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install .NET
        run: |
          curl -fsSL --retry 3 https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          version=$(curl -fsSL --retry 3 https://builds.dotnet.microsoft.com/dotnet/release-metadata/10.0/releases.json | jq -r '."latest-sdk"')
          bash "$RUNNER_TEMP/dotnet-install.sh" --version "$version" --install-dir "$HOME/.dotnet"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Same as the deploy: a /32 rule for this runner only, removed afterwards.
      - name: Allow this runner through the SQL firewall
        id: sql_firewall
        env:
          SQL_SERVER: ${{ vars.SQL_SERVER }}
        run: |
          set -euo pipefail
          ip=$(curl --fail --silent --show-error --retry 3 --max-time 15 https://api.ipify.org)
          if ! [[ "$ip" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "::error::Could not determine an IPv4 address for this runner."
            exit 1
          fi
          rule="github-move-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          az sql server firewall-rule create --resource-group rg-taperday --server "${SQL_SERVER%%.*}" \
            --name "$rule" --start-ip-address "$ip" --end-ip-address "$ip" --output none
          echo "rule_name=$rule" >> "$GITHUB_OUTPUT"
      - name: Move runners
        env:
          MOVE_MODE: ${{ inputs.mode }}
          RUNNER_IDENTITY_MOVES: ${{ secrets.RUNNER_IDENTITY_MOVES }}
          SQL_SERVER: ${{ vars.SQL_SERVER }}
          SQL_DATABASE: ${{ vars.SQL_DATABASE }}
        run: dotnet run --project tools/StartLine.IdentityMove -c Release
      - name: Remove the temporary SQL firewall rule
        if: ${{ always() && steps.sql_firewall.outputs.rule_name != '' }}
        env:
          SQL_SERVER: ${{ vars.SQL_SERVER }}
          RULE_NAME: ${{ steps.sql_firewall.outputs.rule_name }}
        run: |
          az sql server firewall-rule delete --resource-group rg-taperday --server "${SQL_SERVER%%.*}" \
            --name "$RULE_NAME" --output none
