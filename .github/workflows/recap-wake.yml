name: Ops - Wake API for weekly emails

# The free (F1) API may sleep after idle time. Keep it awake through the 07:00–08:00
# send windows across runner time zones (UTC+14 through UTC-12): Monday morning for the
# weekly recap, Thursday morning for the coaching tip (docs/coaching-tips.md).
# The workers check every 15 minutes, and the delivery claims prevent duplicates.
on:
  schedule:
    - cron: '*/15 16-23 * * 0'
    - cron: '*/15 0-20 * * 1'
    - cron: '*/15 16-23 * * 3'
    - cron: '*/15 0-20 * * 4'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the API
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 60 -o /dev/null https://app-taperday-api-3ghg5t.azurewebsites.net/health/live
