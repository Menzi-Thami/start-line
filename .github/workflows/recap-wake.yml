name: Wake the API for the weekly recap

# The free (F1) API may sleep after idle time. Keep it awake through the 07:00–08:00
# Monday morning send window across runner time zones (UTC+14 through UTC-12).
# The worker checks every 15 minutes, and the delivery claim prevents duplicates.
on:
  schedule:
    - cron: '*/15 16-23 * * 0'
    - cron: '*/15 0-20 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the API
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 60 -o /dev/null https://app-taperday-api-3ghg5t.azurewebsites.net/health/live
