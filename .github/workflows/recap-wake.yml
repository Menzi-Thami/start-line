name: Ops - Keep production API awake

# The free (F1) production API unloads after about 20 minutes without a request, and the next runner then waits
# 30 to 40 seconds for it to start. This pings it every 10 minutes, all day, which also keeps the weekly recap and
# coaching tip workers running through their 07:00–08:00 send windows (docs/runner-weekly-recap.md).
#
# Costs nothing: the repository is public, so GitHub Actions minutes are free, and /health/live runs no checks and
# never touches the database (Program.cs). Never point it at /health/ready, and never at staging: staging's free
# serverless database must be left to pause, or it uses up its monthly allowance (docs/deploy.md).
# Scheduled workflows only run from main, so this takes effect with the next release.
on:
  schedule:
    - cron: '3-59/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-production-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the API
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 60 -o /dev/null https://app-taperday-api-3ghg5t.azurewebsites.net/health/live
