name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # gitleaks lists a pull request's commits through the API to scan only what the PR adds.
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
