<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free running plans that adapt every week to how you actually ran." />
    <meta name="theme-color" content="#0a0a0b" />
    <!-- Installable: added to a home screen, Taperday opens full screen like an app (manifest.webmanifest, sw.js). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Taperday" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Taperday · Running plans for your race</title>
    <!-- Link previews. No og:url: a shared plan link must preview as itself, not as the home page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Taperday" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="Taperday · Running plans for your race" />
    <meta property="og:description" content="Free running plans that adapt every week to how you actually ran." />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Taperday: a running plan built for your race, with weekly volume rising to a peak and tapering to race day." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Taperday · Running plans for your race" />
    <meta name="twitter:description" content="Free running plans that adapt every week to how you actually ran." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="Taperday: a running plan built for your race, with weekly volume rising to a peak and tapering to race day." />
  </head>
  <body>
    <link rel="stylesheet" href="/boot.css" />
    <div id="root"><div class="boot-screen" role="status"><p class="boot-brand">Taper<span>day</span></p><p>Loading your running plan…</p><noscript>Enable JavaScript to build a plan.</noscript></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
