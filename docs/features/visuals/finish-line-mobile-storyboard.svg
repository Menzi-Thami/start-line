normal" font-size="16" fill="#C6FF3E">[ Download ]   [ Share ]</text><text x="23" y="441" fill="#99A5AE" font-size="14" font-family="Arial,sans-serif">Actual vs planned must be labeled</text></g><g transform="translate(1266,94)"><rect width="384" height="480" rx="27" fill="#131920" stroke="#52616D" stroke-width="2"/><text x="23" y="34" fill="#C6FF3E" font-size="16" font-weight="bold" font-family="Arial,sans-serif">04 · RACE RESULT</text><path d="M23 52 H360" stroke="#4B535D"/><text x="23" y="93" fill="#FFFFFF" font-size="26" font-weight="bold" font-family="Arial,sans-serif">HOW DID RACE DAY GO?</text><text x="23" y="120" fill="#CBD2D9" font-size="15" font-family="Arial,sans-serif">Never infer a finish from a date</text><rect x="20" y="145" width="344" height="255" rx="16" fill="#202830" stroke="#39434A"/><text x="37" y="183" font-family="Arial,sans-serif" font-weight="bold" font-size="19" fill="#FFFFFF">I finished / DNF / DNS / Later</text><text x="37" y="237" font-family="Arial,sans-serif" font-weight="normal" font-size="16" fill="#FFFFFF">Finish time   __:__:__</text><text x="37" y="291" font-family="Arial,sans-serif" font-weight="normal" font-size="16" fill="#FFFFFF">Link recorded activity (optional)</text><text x="37" y="345" font-family="Arial,sans-serif" font-weight="normal" font-size="16" fill="#C6FF3E">[ Save race result ]</text><text x="23" y="441" fill="#99A5AE" font-size="14" font-family="Arial,sans-serif">Race completion is a separate badge</text></g><g transform="translate(42,604)"><rect width="384" height="480" rx="27" fill="#131920" stroke="#52616D" stroke-width="2"/><text x="23" y="34" fill="#C6FF3E" font-size="16" font-weight="bold" font-family="Arial,sans-serif">05 · RECOVERY HOME</text><path d="M23 52 H360" stroke="#4B535D"/><text x="23" y="93" fill="#FFFFFF" font-size="26" font-weight="bold" font-family="Arial,sans-serif">RECOVERY · DAY 3</text><text x="23" y="120" fill="#CBD2D9" font-size="15" font-family="Arial,sans-serif">Rest is training too.